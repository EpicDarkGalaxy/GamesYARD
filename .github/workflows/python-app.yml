name: Build TicTikBomb

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: TicTikBomb-Linux
          - os: windows-latest
            artifact_name: TicTikBomb-Windows
            
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

    - name: Build with PyInstaller
      run: |
        # --noconsole: Prevents terminal window
        # --onefile: Bundles into one executable
        # --add-data: Ensures your source files/assets are included
        # Note: Linux uses ':' separator, Windows uses ';'
        ${{ matrix.os == 'ubuntu-latest' && 'pyinstaller --noconsole --onefile --name="TicTikBomb" --add-data "src:src" app.py' || 'pyinstaller --noconsole --onefile --name="TicTikBomb" --add-data "src;src" app.py' }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/
